name: A25 connectivity compile audit
on:
  push:
    branches: [a25/connectivity-port]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and link the experimental connectivity stack
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cache=/home/builder/work/build/a25-connectivity-port/llvm20.1.8-v1
          out="$cache/out"
          source="$cache/source"
          mkdir -p "$out" "$source"
          exec 9>"$cache/build.lock"
          flock 9
          # Kbuild records source paths and timestamps in its dependency files.
          git -C "$source" init -q
          git -C "$source" fetch --no-tags --depth=1 "$GITHUB_WORKSPACE" HEAD
          git -C "$source" checkout --detach FETCH_HEAD
          cd "$source"
          # Keep the WLAN compiler command stable across incremental runs.
          export SOURCE_DATE_EPOCH=1794182400
          llvm=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin
          cross=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu-
          export PATH="$llvm:$PATH"
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=deprecated-non-prototype -Wno-error=array-bounds -Wno-error=pointer-bool-conversion -Wno-error=string-plus-int -Wno-error=sizeof-array-div -Wno-error=tautological-compare -Wno-error=deprecated-declarations -Wno-error=strict-prototypes -Wno-error=date-time -Wno-error=int-conversion -Wno-error=single-bit-bitfield-constant-conversion -Wno-error=pointer-to-int-cast -Wno-error=unused-variable -Wno-unknown-warning-option"
          kbuild=(make O="$out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CROSS_COMPILE="$cross")
          config_key=$(sha256sum arch/arm64/configs/a25_gravity_defconfig | cut -d ' ' -f 1)
          if [ ! -s "$out/.config" ] || [ "$(cat "$out/a25-defconfig.sha" 2>/dev/null || true)" != "$config_key" ]; then
            echo "Initializing A25 connectivity config"
            "${kbuild[@]}" a25_gravity_defconfig
          else
            echo "Reusing A25 connectivity build directory"
          fi
          scripts/config --file "$out/.config" --enable MTK_COMBO_BT --enable A25_CONNECTIVITY_DONOR
          "${kbuild[@]}" olddefconfig
          grep -Fx 'CONFIG_A25_CONNECTIVITY_DONOR=y' "$out/.config"
          grep -Fx 'CONFIG_MTK_COMBO_CHIP="CONSYS_6765"' "$out/.config"
          printf '%s\n' "$config_key" > "$out/a25-defconfig.sha"
          "${kbuild[@]}" -j"$(nproc)" Image.gz
          for driver in common wlan/adaptor wlan/core/gen4m bt/mt66xx/wmt gps fmradio; do
            archive="$out/vendor/mediatek/kernel_modules/connectivity/$driver/built-in.a"
            test -n "$(llvm-ar t "$archive")"
          done
          artifact=$(mktemp -d "${RUNNER_TEMP:?}/a25-connectivity-artifact.XXXXXX")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          cp "$out/arch/arm64/boot/Image.gz" "$artifact/"
          cp "$out/.config" "$artifact/kernel.config"
          test -s "$out/Module.symvers"
          cp "$out/Module.symvers" "$artifact/"
          (cd "$artifact" && sha256sum Image.gz kernel.config Module.symvers > SHA256SUMS)
      - name: Upload experimental kernel
        uses: actions/upload-artifact@v4
        with:
          name: a25-connectivity-experimental
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
