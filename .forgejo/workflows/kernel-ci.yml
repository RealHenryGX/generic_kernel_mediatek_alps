name: kernel-ci
on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        required: false
        default: false
        type: boolean
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: Bearer ${GITHUB_TOKEN}" \
            fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Source checks
        run: |
          git diff --check
          test -f Makefile
      - name: Build read-only BPF map inventory
        run: |
          mkdir -p /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf
          /home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang \
            --target=aarch64-linux-gnu -nostdlib -static -fno-builtin \
            -fuse-ld=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld \
            -Wl,-e,_start -Wl,--build-id=none \
            tools/bpf-map-inventory.c \
            -o /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-map-inventory
          /home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang \
            --target=aarch64-linux-gnu -nostdlib -static -fno-builtin \
            -fuse-ld=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld \
            -Wl,-e,_start -Wl,--build-id=none \
            tools/bpf-flock-probe.c \
            -o /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-flock-probe
          /home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang \
            --target=aarch64-linux-gnu -nostdlib -static -fno-builtin \
            -fuse-ld=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld \
            -Wl,-e,_start -Wl,--build-id=none \
            tools/bpf-native-contract-probe.c \
            -o /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-native-contract-probe
          /home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang \
            --target=aarch64-linux-gnu -nostdlib -static -fno-builtin \
            -fuse-ld=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld \
            -Wl,-e,_start -Wl,--build-id=none \
            tools/bpf-netd-map-dump.c \
            -o /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-netd-map-dump
          /home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang \
            --target=aarch64-linux-gnu -nostdlib -static -fno-builtin \
            -fuse-ld=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld \
            -Wl,-e,_start -Wl,--build-id=none \
            tools/bpf-fcntl-probe.c \
            -o /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-fcntl-probe
      - name: Publish read-only BPF map inventory
        run: |
          artifact_dir=/home/builder/work/build/a25-wusb-kbuild-integration/artifacts/${GITHUB_SHA}
          mkdir -p "${artifact_dir}/bpf-map-inventory"
          cp /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-map-inventory \
             /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-flock-probe \
             /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-native-contract-probe \
             /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-netd-map-dump \
             /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/bpf-fcntl-probe \
             "${artifact_dir}/bpf-map-inventory/"
          sha256sum "${artifact_dir}/bpf-map-inventory"/* > "${artifact_dir}/bpf-map-inventory/SHA256SUMS"
          if-no-files-found: error
      - name: Incremental BPF netd build
        run: |
          mkdir -p /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=deprecated-non-prototype -Wno-error=array-bounds -Wno-error=pointer-bool-conversion -Wno-error=string-plus-int -Wno-error=sizeof-array-div -Wno-error=tautological-compare -Wno-error=deprecated-declarations -Wno-error=strict-prototypes -Wno-error=date-time -Wno-error=int-conversion -Wno-error=single-bit-bitfield-constant-conversion -Wno-error=pointer-to-int-cast -Wno-error=unused-variable -Wno-unknown-warning-option"
          if [ ! -f /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/.config ]; then cp /home/builder/work/build/a25-wusb-kbuild-integration/out/kbuild/.config /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/.config; fi
          make O=/home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf ARCH=arm64 CC=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang LD=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld AR=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-ar NM=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-nm OBJCOPY=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objcopy OBJDUMP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objdump READELF=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-readelf STRIP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-strip CROSS_COMPILE=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu- olddefconfig
          make -j$(nproc) O=/home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf ARCH=arm64 CC=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang LD=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld AR=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-ar NM=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-nm OBJCOPY=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objcopy OBJDUMP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objdump READELF=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-readelf STRIP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-strip CROSS_COMPILE=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu- security/selinux/hooks.o
      - name: Full Image gz build
        if: github.event_name == 'workflow_dispatch' || inputs.full_build == true || startsWith(github.ref, 'refs/heads/codex/cleanup-bpf-20261104')
        run: |
          mkdir -p /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=deprecated-non-prototype -Wno-error=array-bounds -Wno-error=pointer-bool-conversion -Wno-error=string-plus-int -Wno-error=sizeof-array-div -Wno-error=tautological-compare -Wno-error=deprecated-declarations -Wno-error=strict-prototypes -Wno-error=date-time -Wno-error=int-conversion -Wno-error=single-bit-bitfield-constant-conversion -Wno-error=pointer-to-int-cast -Wno-error=unused-variable -Wno-unknown-warning-option"
          cp /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/.config /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full/.config
          make -j$(nproc) O=/home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full ARCH=arm64 CC=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang LD=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld AR=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-ar NM=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-nm OBJCOPY=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objcopy OBJDUMP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objdump READELF=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-readelf STRIP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-strip CROSS_COMPILE=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu- olddefconfig
          make -j$(nproc) O=/home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full ARCH=arm64 CC=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/clang LD=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/ld.lld AR=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-ar NM=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-nm OBJCOPY=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objcopy OBJDUMP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-objdump READELF=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-readelf STRIP=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin/llvm-strip CROSS_COMPILE=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu- Image.gz
          ls -l /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full/arch/arm64/boot/Image.gz
          sha256sum /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full/arch/arm64/boot/Image.gz
      - name: Upload full kernel artifact
        if: github.event_name == 'workflow_dispatch' || inputs.full_build == true || startsWith(github.ref, 'refs/heads/codex/cleanup-bpf-20261104')
        run: |
          artifact_dir=/home/builder/work/build/a25-wusb-kbuild-integration/artifacts/${GITHUB_SHA}
          mkdir -p "${artifact_dir}"
          cp /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-full/arch/arm64/boot/Image.gz "${artifact_dir}/Image.gz"
          sha256sum "${artifact_dir}/Image.gz" | tee "${artifact_dir}/SHA256SUMS"
