name: A25 local runner build

on:
  workflow_dispatch:
    inputs:
      full_build:
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGE_USERNAME: ${{ secrets.PACKAGE_USERNAME }}
      PACKAGE_PASSWORD: ${{ secrets.PACKAGE_PASSWORD }}
    steps:
      - name: Clone from the local Forgejo instance
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          git -C "$source_dir" init -q
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" -c http.extraHeader="Authorization: token $GITHUB_TOKEN" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          echo "A25_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Build connectivity stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$A25_SOURCE_DIR"
          cache=/home/builder/work/build/a25-connectivity-port/llvm20.1.8-v1
          out="$cache/out"
          source="$cache/source"
          mkdir -p "$out" "$source"
          exec 9>"$cache/build.lock"
          flock 9
          rm -rf "$source"
          mkdir -p "$source"
          cp -a "$A25_SOURCE_DIR/." "$source/"
          cd "$source"
          export SOURCE_DATE_EPOCH=1794182400
          llvm=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin
          cross=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu-
          export PATH="$llvm:$PATH"
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=deprecated-non-prototype -Wno-error=array-bounds -Wno-error=pointer-bool-conversion -Wno-error=string-plus-int -Wno-error=sizeof-array-div -Wno-error=tautological-compare -Wno-error=deprecated-declarations -Wno-error=strict-prototypes -Wno-error=date-time -Wno-error=int-conversion -Wno-error=single-bit-bitfield-constant-conversion -Wno-error=pointer-to-int-cast -Wno-error=unused-variable -Wno-unknown-warning-option"
          kbuild=(make O="$out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CROSS_COMPILE="$cross")
          config_key=$(sha256sum arch/arm64/configs/a25_gravity_defconfig | cut -d ' ' -f 1)
          if [ ! -s "$out/.config" ] || [ "$(cat "$out/a25-defconfig.sha" 2>/dev/null || true)" != "$config_key" ]; then
            "${kbuild[@]}" a25_gravity_defconfig
          fi
          scripts/config --file "$out/.config" --enable MTK_COMBO_BT --enable A25_CONNECTIVITY_DONOR
          "${kbuild[@]}" olddefconfig
          printf '%s\n' "$config_key" > "$out/a25-defconfig.sha"
          "${kbuild[@]}" -j"$(nproc)" Image.gz
          for driver in common wlan/adaptor wlan/core/gen4m bt/mt66xx/wmt gps fmradio; do
            archive="$out/vendor/mediatek/kernel_modules/connectivity/$driver/built-in.a"
            test -n "$(llvm-ar t "$archive")"
          done
          artifact="/home/builder/work/build/a25-connectivity-port/artifacts/$GITHUB_SHA"
          mkdir -p "$artifact"
          cp "$out/arch/arm64/boot/Image.gz" "$artifact/"
          cp "$out/.config" "$artifact/kernel.config"
          cp "$out/Module.symvers" "$artifact/"

          module_out="$cache/out/modules"
          module_install="$module_out/install"
          rm -rf "$module_out"
          mkdir -p "$module_out"
          cp "$out/.config" "$module_out/.config"
          scripts/config --file "$module_out/.config" --module A25_CONNECTIVITY_DONOR
          make O="$module_out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE="$cross" olddefconfig
          unset KBUILD_CFLAGS KBUILD_AFLAGS KBUILD_CPPFLAGS KBUILD_LDFLAGS
          make -j"$(nproc)" O="$module_out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE="$cross" modules
          make O="$module_out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE="$cross" modules_install INSTALL_MOD_PATH="$module_install"
          find "$module_install" -type f -name '*.ko' -exec cp {} "$artifact"/ \;
          for module in wlan_drv_gen4m.ko wmt_chrdev_wifi.ko bt_drv_connac1x.ko gps_drv.ko fmradio_drv_mt6631.ko; do
            test -s "$artifact/$module"
          done
          (cd "$artifact" && sha256sum Image.gz kernel.config Module.symvers *.ko > SHA256SUMS)

      - name: Publish connectivity artifacts to Forgejo
        shell: bash
        run: |
          set -euo pipefail
          artifact="/home/builder/work/build/a25-connectivity-port/artifacts/$GITHUB_SHA"
          for file in "$artifact"/*; do
            name="$(basename "$file")"
            curl --fail-with-body --retry 3 --user "$PACKAGE_USERNAME:$PACKAGE_PASSWORD" \
              --upload-file "$file" \
              "$GITHUB_SERVER_URL/api/packages/$GITHUB_REPOSITORY_OWNER/generic/a25-connectivity-port/$GITHUB_SHA/$name"
          done

      - name: Build full kernel image
        if: inputs.full_build == true
        shell: bash
        run: |
          set -euo pipefail
          cd "$A25_SOURCE_DIR"
          cache=/home/builder/work/build/a25-wusb-kbuild-integration
          out="$cache/out/ci-full"
          mkdir -p "$out"
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=deprecated-non-prototype -Wno-error=array-bounds -Wno-error=pointer-bool-conversion -Wno-error=string-plus-int -Wno-error=sizeof-array-div -Wno-error=tautological-compare -Wno-error=deprecated-declarations -Wno-error=strict-prototypes -Wno-error=date-time -Wno-error=int-conversion -Wno-error=single-bit-bitfield-constant-conversion -Wno-error=pointer-to-int-cast -Wno-error=unused-variable -Wno-unknown-warning-option"
          llvm=/home/builder/work/toolchain/llvm20/LLVM-20.1.8-Linux-X64/bin
          cross=/home/builder/work/toolchain/toolchain/bin/aarch64-linux-gnu-
          export PATH="$llvm:$PATH"
          cp /home/builder/work/build/a25-wusb-kbuild-integration/out/ci-bpf/.config "$out/.config"
          make -j"$(nproc)" O="$out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CROSS_COMPILE="$cross" olddefconfig
          make -j"$(nproc)" O="$out" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CROSS_COMPILE="$cross" Image.gz
          artifact="/home/builder/work/build/a25-wusb-kbuild-integration/artifacts/$GITHUB_SHA"
          mkdir -p "$artifact"
          cp "$out/arch/arm64/boot/Image.gz" "$artifact/"
          sha256sum "$artifact/Image.gz" > "$artifact/SHA256SUMS"

      - name: Publish full kernel artifact to Forgejo
        if: inputs.full_build == true
        shell: bash
        run: |
          set -euo pipefail
          artifact="/home/builder/work/build/a25-wusb-kbuild-integration/artifacts/$GITHUB_SHA"
          for file in "$artifact"/*; do
            name="$(basename "$file")"
            curl --fail-with-body --retry 3 --user "$PACKAGE_USERNAME:$PACKAGE_PASSWORD" \
              --upload-file "$file" \
              "$GITHUB_SERVER_URL/api/packages/$GITHUB_REPOSITORY_OWNER/generic/a25-kernel-full/$GITHUB_SHA/$name"
          done
